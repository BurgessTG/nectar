services:
  mysql:
    image: mysql:8.4
    container_name: nectar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nectar}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nectar}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --max-connections=300
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-8G}
      - --innodb-redo-log-capacity=${MYSQL_INNODB_REDO_LOG_CAPACITY:-2G}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

volumes:
  mysql-data:

# Example DSN:
# root:nectar@tcp(localhost:3306)/nectar?charset=utf8mb4&parseTime=True&loc=Local
